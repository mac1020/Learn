name: "Terraform Plan"

on:
  pull_request:
    branches:
        - master
    paths:
      - 'terraform/**'

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: cd terraform/Practice && terraform init -input=false

      - name: Terraform Validate
        run: cd terraform/Practice && terraform validate
      
      - name: Test Azure Login
        run: az account show
      
      
      - name: Terraform Plan
        id: plan
        run: |
          cd terraform/Practice
          terraform plan -out=tfplan
          terraform show tfplan > plan.txt

      - name: Send Terraform Plan via Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Terraform Plan Output"
          to: "kush20mehak@gmail.com"
          from: "Terraform Bot <${{ secrets.EMAIL_USER }}>"
          secure: true
          attachments: terraform/Practice/plan.txt
          body: |
            Hello,
            Please find attached the Terraform Plan generated in GitHub Actions.

