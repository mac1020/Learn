name: "Terraform Plan"

on:
  pull_request:
    branches:
        - master
    paths:
      - 'terraform/**'

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: cd terraform/Practice && terraform init -input=false

      - name: Terraform Validate
        run: cd terraform/Practice && terraform validate
      
      - name: Test Azure Login
        run: az account show
      
      
      - name: Terraform Plan
        id: plan
        run: |
          cd terraform/Practice
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Upload Plan as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/Practice/plan.txt
