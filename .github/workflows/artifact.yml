name: Artifact Example
on: 
    push
jobs:
    upload:
        runs-on: ubuntu-latest
        steps:
            - name: create artifact
              run: |
                mkdir dist
                echo "This is a build file" > dist/build.txt
            - name: upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: output
                path: dist/
    download:
        needs: upload
        runs-on: ubuntu-latest
        steps:
            - name: download artifact
              uses: actions/upload-artifact@v4
              with:
                name: output
                path: ./downloaded/
            - name: print artifact
              run: cat ./downloaded/build.txt
